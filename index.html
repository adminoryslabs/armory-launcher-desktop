<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Armory Launcher</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="search-bar">
        <input
          id="search-input"
          type="text"
          placeholder="Buscar skills y prompts..."
          autocomplete="off"
          spellcheck="false"
        />
        <button id="refresh-btn" title="Actualizar catálogo" aria-label="Actualizar catálogo">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12a9 9 0 1 1-2.64-6.36" />
            <path d="M21 4v6h-6" />
          </svg>
        </button>
      </header>

      <div class="tabs" role="tablist">
        <button class="tab active" id="tab-skills" role="tab" aria-selected="true" data-type="skill">
          Skills <span class="tab-count" id="count-skills"></span>
        </button>
        <button class="tab" id="tab-prompts" role="tab" aria-selected="false" data-type="prompt">
          Prompts <span class="tab-count" id="count-prompts"></span>
        </button>
      </div>

      <main id="results">
        <div class="row-list" id="list-skills"></div>
        <div class="row-list hidden" id="list-prompts"></div>
      </main>

      <footer class="app-footer">
        <span id="version-label"></span>
      </footer>

      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
